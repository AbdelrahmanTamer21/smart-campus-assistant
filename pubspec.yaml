name: mobile_project
description: "Smart Campus Assistant — your university life, simplified."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  firebase_messaging: ^16.0.2
  cloud_functions: ^6.0.2

  # State
  provider: ^6.1.2

  # Routing
  go_router: ^14.6.2

  # Device & platform
  connectivity_plus: ^6.1.0
  geolocator: ^13.0.2
  local_auth: ^2.3.0
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  flutter_local_notifications: ^18.0.1

  # Utils
  intl: ^0.20.1
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: Hanken Grotesk
      fonts:
        - asset: assets/fonts/HankenGrotesk-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
